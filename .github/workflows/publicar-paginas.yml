name: Publicar projetos da disciplina
on:
  push:
    branches: [main]
    paths:
      - 'linguagens-de-programacao/projeto-precos-combustiveis/**'
      - 'linguagens-de-programacao/projeto-saneamento-sinisa/docs/**'
      - '.github/workflows/publicar-paginas.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Preparar paginas e arquivos de apoio
        run: |
          mkdir -p _site/projeto-precos-combustiveis _site/projeto-saneamento-sinisa
          cp linguagens-de-programacao/projeto-precos-combustiveis/index.html _site/projeto-precos-combustiveis/
          cp -r linguagens-de-programacao/projeto-precos-combustiveis/imagens _site/projeto-precos-combustiveis/
          cp -r linguagens-de-programacao/projeto-precos-combustiveis/documentacao _site/projeto-precos-combustiveis/
          cp -r linguagens-de-programacao/projeto-saneamento-sinisa/docs/. _site/projeto-saneamento-sinisa/
          cat > _site/index.html <<'HTML'
          <!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Unilasalle-RJ · Guilherme Daflon</title>
          <style>body{font-family:system-ui,sans-serif;background:#0d1117;color:#e6edf3;max-width:760px;margin:0 auto;padding:48px 20px;line-height:1.5}a{color:#58a6ff;text-decoration:none}a:hover{text-decoration:underline}.card{border:1px solid #30363d;border-radius:12px;padding:20px 22px;margin:14px 0;background:#161b22}.tag{font-size:13px;color:#8b949e}h1{margin-bottom:4px}</style></head>
          <body><h1>Unilasalle-RJ · Sistemas de Informação</h1><p class="tag">Projetos publicados de Guilherme Daflon</p>
          <div class="card"><div class="tag">Linguagens de Programação · G2</div><h2><a href="projeto-saneamento-sinisa/">Atendimento por redes de água e esgoto no Brasil em 2024</a></h2><p>Artigo com dados do SINISA 2025.</p></div>
          <div class="card"><div class="tag">Linguagens de Programação · G1</div><h2><a href="projeto-precos-combustiveis/">Combustíveis no Brasil</a></h2><p>Evolução dos preços e diferenças entre UFs, de 2015 a 2024 · <a href="https://lasalle-combustiveis-g1.streamlit.app/">dashboard</a></p></div>
          <p class="tag"><a href="https://github.com/GDaflon/lasalle">Código no GitHub</a></p></body></html>
          HTML
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy
